name: Daily backup from STRATO

on:
  schedule:
    # 04:00 UTC every day
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  backup:
    name: Pull data.json and commit to backups branch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Download current data.json from STRATO
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.STRATO_SFTP_PORT }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.STRATO_REMOTE_DIR }}
        run: |
          echo "SNAPSHOT=jagdkarte-$(date -u +%Y%m%d-%H%M%S).json" >> "$GITHUB_ENV"
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 30
          cd "$REMOTE_DIR"
          get jagdmap/data.json -o "$SNAPSHOT"
          bye
          EOF

      - name: Commit snapshot to backups branch
        run: |
          git fetch origin backups
          git checkout backups
          git add "$SNAPSHOT"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git -c user.name="backup-bot" -c user.email="backup-bot@users.noreply.github.com" \
              commit -m "backup: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin backups
          fi
        env:
          SNAPSHOT: ${{ env.SNAPSHOT }}
